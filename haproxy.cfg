global
    log stdout format raw local0
    log stdout format raw local1 notice

    maxconn 100000
    daemon

    # Runtime API (critical for ops)
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s

    # Performance tuning
    tune.bufsize 32768
    tune.maxrewrite 1024
    tune.ssl.default-dh-param 2048

    # SSL (if used)
    ssl-default-bind-options no-sslv3 no-tlsv10 no-tlsv11
    ssl-default-bind-ciphers PROFILE=SYSTEM

defaults
    mode http
    log global

    option httplog
    option dontlognull
    option redispatch
    option http-server-close
    option forwardfor

    retries 3

    timeout connect 5s
    timeout client  60s
    timeout server  60s
    timeout http-request 10s
    timeout queue 30s

    # Health check defaults
    option httpchk GET /health
    http-check expect status 200

    # Error handling
    errorfile 400 /etc/haproxy/errors/400.http
    errorfile 403 /etc/haproxy/errors/403.http
    errorfile 408 /etc/haproxy/errors/408.http
    errorfile 500 /etc/haproxy/errors/500.http
    errorfile 502 /etc/haproxy/errors/502.http
    errorfile 503 /etc/haproxy/errors/503.http
    errorfile 504 /etc/haproxy/errors/504.http


frontend http_front
    bind *:80
    # bind *:443 ssl crt /etc/haproxy/certs/  # enable if TLS needed

    # Normalize request
    http-request set-header X-Forwarded-Proto http if !{ ssl_fc }
    http-request set-header X-Forwarded-For %[src]

    # Capture headers for debugging
    capture request header Host len 50
    capture request header User-Agent len 100

    # ACLs (host-based routing)
    acl host_example1 hdr(host) -i example1.com
    acl host_example2 hdr(host) -i example2.com
    acl host_example3 hdr(host) -i example3.com

    # Path-based ACL (example for APIs)
    acl is_api path_beg /api

    # Routing logic
    use_backend example1_backend if host_example1
    use_backend example2_backend if host_example2
    use_backend example3_backend if host_example3 is_api

    # Default fallback
    default_backend fallback_backend

    # Security headers
    http-response set-header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
    http-response set-header X-Frame-Options SAMEORIGIN
    http-response set-header X-Content-Type-Options nosniff
    http-response set-header X-XSS-Protection "1; mode=block"

# =========================
# BACKENDS
# =========================

backend example1_backend
    balance leastconn

    # Connection reuse
    http-reuse safe

    # Health checks
    option httpchk GET /health
    http-check expect status 200

    server app1 192.168.1.10:30002 check inter 3s fall 3 rise 2 maxconn 1000
    server app2 192.168.1.11:30002 check inter 3s fall 3 rise 2 maxconn 1000

backend example2_backend
    balance leastconn
    http-reuse safe

    option httpchk GET /health
    http-check expect status 200

    server app1 192.168.2.10:30002 check inter 3s fall 3 rise 2 maxconn 1000
    server app2 192.168.2.11:30002 check inter 3s fall 3 rise 2 maxconn 1000

backend example3_backend
    balance leastconn
    http-reuse safe

    option httpchk GET /health
    http-check expect status 200

    server app1 192.168.3.10:7050 check inter 3s fall 3 rise 2 maxconn 1000
    server app2 192.168.3.11:7050 check inter 3s fall 3 rise 2 maxconn 1000

# =========================
# FALLBACK / ERROR BACKEND
# =========================
backend fallback_backend
    mode http
    http-request return status 503 content-type "text/plain" string "Service unavailable"

# =========================
# STATS (OPTIONAL BUT CRITICAL)
# =========================
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    stats auth admin:admin123